# Nginx server block for club.rasatech.in — a NEW file; no existing block is touched.
# Install: copy to /etc/nginx/sites-available/club.rasatech.in, symlink into sites-enabled,
# `nginx -t && systemctl reload nginx`. Replace 3105 if APP_PORT differs.

upstream club_management_app {
    server 127.0.0.1:3105;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name club.rasatech.in;

    # Let's Encrypt HTTP-01 challenges (webroot used by certbot certonly).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 (Ubuntu 24.04) syntax; on nginx >= 1.25.1 use `listen 443 ssl;` + `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name club.rasatech.in;

    ssl_certificate     /etc/letsencrypt/live/club.rasatech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/club.rasatech.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:club_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Up to 5 bills x 5 MB per entry, plus form overhead.
    client_max_body_size 30m;

    access_log /var/log/nginx/club.rasatech.in.access.log;
    error_log  /var/log/nginx/club.rasatech.in.error.log;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Next.js already marks /_next/static/* as immutable, so no extra Cache-Control here.

    location / {
        proxy_pass http://club_management_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
